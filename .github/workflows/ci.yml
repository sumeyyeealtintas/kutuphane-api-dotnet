name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test --nologo
      - name: Güvenlik açığı taraması
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee tarama.txt
          ! grep -q "has the following vulnerable packages" tarama.txt
